<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zorax — practice form</title>
<style>body{font:16px system-ui;background:#f5f4ef;color:#152a31;max-width:780px;margin:40px auto;padding:24px}h1{font-size:34px}form{background:white;padding:28px;border-radius:18px;display:grid;gap:18px}label{display:grid;gap:7px}input,select,button{font:inherit;padding:11px;border:1px solid #bbc6c7;border-radius:8px}button{background:#153d36;color:white;cursor:pointer}fieldset{border:1px solid #cdd5d2;border-radius:8px}fieldset label{display:inline-block;margin:12px}pre{white-space:pre-wrap;font-size:13px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.bar label{display:flex;align-items:center}small{color:#536266}</style></head>
<body><small>ZORAX FORM FILLER / LOCAL PRACTICE</small><h1>Your details. One click.</h1><p>This practice page uses fictional details. It never submits anything. Sample choices select an option that actually exists.</p>
<div class="bar"><label><input type="checkbox" id="samples" checked>Pick sample choices</label><button id="demo" type="button">Fill demo profile</button><button id="undoDemo" type="button">Undo last fill</button></div>
<form id="practice"><label>First name<input autocomplete="given-name" name="first_name"></label><label>Last name<input autocomplete="family-name" name="last_name"></label><label>Email<input type="email" autocomplete="email" name="email"></label><label>Phone<input type="tel" autocomplete="tel" name="phone"></label><label>Country<select autocomplete="country" name="country"><option value="">Choose country</option><option value="IN">India</option><option value="US">United States</option><option value="AU">Australia</option></select></label><label>Bedrooms<select name="bedrooms"><option value="">Choose bedrooms</option><option value="2">2 bedrooms</option><option value="4">4 bedrooms</option><option value="6">6 bedrooms</option></select></label><fieldset><legend>Preferred contact method</legend><label><input type="radio" name="channel" value="email">Email</label><label><input type="radio" name="channel" value="phone">Phone</label></fieldset><label>Annual income — remains manual<input name="annual_income"></label><label style="display:block"><input type="checkbox" name="consent"> I agree to receive marketing — remains manual</label><button type="button">Practice only — no submission</button></form>
<pre id="result" aria-live="polite"></pre><script src="extension/engine.js"></script><script src="practice.js"></script></body></html>
